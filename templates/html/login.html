{{define "content"}}
<div class="card">
    <h1>Login</h1>

    <!-- Display error message if the handler passes one -->
    {{if .}}
    <div style="background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 1rem; border: 1px solid #ef9a9a;">
        {{.}}
    </div>
    {{end}}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
        <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>
</div>
{{end}}
