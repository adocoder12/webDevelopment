{{define "content"}}
<section class="hero">
    <h1 class="hero__title hero__title--small">Welcome back</h1>

    <div class="family-card">
        <form action="/login" method="POST" class="form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" required>
            </div>

            <button type="submit" class="btn-midnight btn-midnight--full">Sign In</button>
        </form>

        <div class="family-card__footer">
            <p class="footer-note">
                New here? <a href="/register" class="link-accent">Join Family</a>
            </p>
        </div>
    </div>
</section>
{{end}}
