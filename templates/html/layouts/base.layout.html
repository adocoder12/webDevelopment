{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/main.css">
  <title>{{block "title" .}}Family Adventure{{end}}</title>
</head>
<body class="app">

<header class="header">
  <nav class="nav">
    <a href="/" class="nav__logo">Family</a>
    <div class="nav__group">
      <a href="/login" class="nav__link">Log In</a>
      <a href="/register" class="btn-midnight">Get Started</a>
    </div>
  </nav>
</header>

<main class="main-container">
  {{template "content" .}}
</main>

<footer class="footer">
  <p class="footer__text">&copy; 2026 Archive Collection &bull; Built in Go</p>
</footer>

</body>
</html>
{{end}}
