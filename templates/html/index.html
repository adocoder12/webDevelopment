{{define "content"}}
<div class="card">
    <h1>Welcome to your Go App</h1>
    <p>This page is being rendered by your <code>renderTemplate</code> function.</p>

    <hr style="border: 0; border-top: 1px solid #444; margin: 1.5rem 0;">

    <!-- Data passed from app.renderTemplate(w, "index.html", data) -->
    <div id="content">
        {{if .}}
        <p><strong>Message from Server:</strong> {{.}}</p>
        {{else}}
        <p>No data passed to template yet.</p>
        {{end}}
    </div>
</div>
{{end}}
